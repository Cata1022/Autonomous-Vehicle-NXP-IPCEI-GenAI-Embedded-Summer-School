[env:esp32s3_cam]
platform = espressif32
; We use the generic devkitc-1 as the base
board = esp32-s3-devkitc-1
framework = arduino

; 1. Override Flash size to 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; 2. Enable OPI PSRAM (8MB)
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -DEI_CLASSIFIER_ALLOCATION_STATIC=1

; 3. Official Camera Library
lib_deps = 
    espressif/esp32-camera
	h2zero/NimBLE-Arduino

; 4. Maximize Flash Speed for AI model loading (Optional but recommended)
board_build.f_flash = 80000000L
board_build.flash_mode = qio
